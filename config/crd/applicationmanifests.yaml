apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationmanifests.apps.temporalcontroller.io
spec:
  group: apps.temporalcontroller.io
  scope: Namespaced
  names:
    kind: ApplicationManifest
    listKind: ApplicationManifestList
    plural: applicationmanifests
    singular: applicationmanifest
    shortNames: [appm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Workflow
          type: string
          jsonPath: .status.workflow.workflowID
        - name: Gen
          type: integer
          jsonPath: .metadata.generation
        - name: Observed
          type: integer
          jsonPath: .status.workflow.observedGeneration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: { type: string }
            kind:       { type: string }
            metadata:   { type: object }

            spec:
              type: object
              required: [components]
              properties:
                suspend:
                  type: boolean
                  default: false
                  description: >-
                    If true, spec changes are recorded but no new workflow is started.
                    Unsuspending triggers a workflow for the current generation.

                components:
                  type: array
                  minItems: 1
                  maxItems: 50
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  x-kubernetes-validations:
                    - rule: "self.all(c, !has(c.dependsOn) || c.dependsOn.all(d, d != c.name && self.exists(o, o.name == d)))"
                      message: "dependsOn must reference other components in this manifest"
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      type:
                        type: string
                        maxLength: 63
                        description: Component type, e.g. webservice, worker, task, helm.
                      properties:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: Free-form parameters interpreted by the component type.
                      dependsOn:
                        type: array
                        maxItems: 20
                        items: { type: string, maxLength: 63 }
                      traits:
                        type: array
                        maxItems: 20
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: [type]
                        items:
                          type: object
                          required: [type]
                          properties:
                            type:
                              type: string
                              maxLength: 63
                              description: Trait type, e.g. scaler, gateway, labels, sidecar.
                            properties:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true

                policies:
                  type: array
                  maxItems: 20
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name: { type: string, maxLength: 63 }
                      type:
                        type: string
                        maxLength: 63
                        description: Policy type, e.g. topology, override, garbage-collect.
                      properties:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true

                workflow:
                  type: object
                  description: >-
                    Optional. If omitted, the default workflow deploys every component
                    in dependsOn order.
                  properties:
                    mode:
                      type: string
                      enum: [StepByStep, DAG]
                      default: StepByStep
                    steps:
                      type: array
                      maxItems: 50
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, type]
                        properties:
                          name: { type: string, maxLength: 63 }
                          type:
                            type: string
                            maxLength: 63
                            description: Step type, e.g. deploy, apply-component, suspend, notification, webhook.
                          properties:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          dependsOn:
                            type: array
                            maxItems: 20
                            items: { type: string, maxLength: 63 }
                          if:
                            type: string
                            description: Optional condition evaluated by the workflow, e.g. "status.prev.succeeded".
                          timeout:
                            type: string
                            pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                            description: Step timeout (Go duration). Maps to the activity StartToClose timeout.

            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed, Suspended]
                message: { type: string }

                workflow:
                  type: object
                  description: The Temporal execution for the most recently observed generation.
                  properties:
                    observedGeneration: { type: integer, format: int64 }
                    workflowID:         { type: string }
                    runID:              { type: string }
                    taskQueue:          { type: string }
                    status:
                      type: string
                      enum: [Running, Completed, Failed, Canceled, Terminated, TimedOut, ContinuedAsNew]
                    startTime: { type: string, format: date-time }
                    closeTime: { type: string, format: date-time }
                    message:   { type: string }
                    steps:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:  { type: string }
                          type:  { type: string }
                          phase:
                            type: string
                            enum: [Pending, Running, Succeeded, Failed, Skipped]
                          message:   { type: string }
                          startTime: { type: string, format: date-time }
                          endTime:   { type: string, format: date-time }

                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string, maxLength: 316 }
                      status:             { type: string, enum: ["True", "False", "Unknown"] }
                      observedGeneration: { type: integer, format: int64, minimum: 0 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string, maxLength: 1024, minLength: 1 }
                      message:            { type: string, maxLength: 32768 }
